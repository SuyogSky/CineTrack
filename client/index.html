<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="description" content="CineTrack - Personal movie & TV series watchlist and collaborative collection management platform." />
    <meta name="theme-color" content="#0b0d13" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>CineTrack — Movie & TV Watchlists & Collaborative Collections</title>
    <script>
      (function() {
        try {
          var t = localStorage.getItem('cinetrack_theme') || 'dark';
          document.documentElement.className = t;
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', t === 'light' ? '#f4f6fb' : '#0b0d13');
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="bg-[#0b0d13] text-slate-100 antialiased selection:bg-red-600 selection:text-white">
    <div id="root">
      <div id="initial-splash" style="position:fixed;inset:0;background:#0b0d13;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:system-ui,-apple-system,sans-serif;color:#ffffff;z-index:9999;">
        <div style="width:72px;height:72px;border-radius:20px;background:linear-gradient(135deg,#dc2626,#e11d48);display:flex;align-items:center;justify-content:center;box-shadow:0 12px 30px rgba(225,29,72,0.4);margin-bottom:16px;">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect>
            <line x1="7" y1="2" x2="7" y2="22"></line>
            <line x1="17" y1="2" x2="17" y2="22"></line>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <line x1="2" y1="7" x2="7" y2="7"></line>
            <line x1="2" y1="17" x2="7" y2="17"></line>
            <line x1="17" y1="17" x2="22" y2="17"></line>
            <line x1="17" y1="7" x2="22" y2="7"></line>
          </svg>
        </div>
        <div style="font-size:26px;font-weight:800;letter-spacing:-0.5px;color:#ffffff;">
          Cine<span style="color:#ef4444;">Track</span>
        </div>
        <div style="font-size:12px;color:#94a3b8;margin-top:4px;">
          Your Personal Media Library
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
